# Workspace root for the flutter_vscode repository.
#
# This package is never published: it exists so that one `pub get` at the
# checkout root resolves every package in the repository, which is what
# makes `flutter analyze` meaningful across the whole tree. The published
# package is `packages/flutter_vscode`.
name: flutter_vscode_repository
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - packages/dart_vscode
  - packages/flutter_vscode
  - extensions/coverage_treemap/host
  - extensions/coverage_treemap/shared
  - extensions/coverage_treemap/views/treemap_panel
  - extensions/pubspec_lens/host
  - extensions/pubspec_lens/shared
  - packages/flutter_vscode/test/fixtures/host_extension/host
  - packages/flutter_vscode/test/fixtures/host_extension/shared
  - packages/flutter_vscode/test/fixtures/host_extension/views/main
